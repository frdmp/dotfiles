set -as terminal-features ",alacritty*:RGB"

unbind C-b
set -g prefix M-j
bind M-j send-prefix
set -g mouse on
setw -g mode-keys vi

# Status bar
set -g status-position top
set -g status-justify left
set -g status-style "bg=#eff1f5,fg=#4c4f69"

# Status left
set -g status-left ""

# Status right - time
set -g status-right-length 60
set -g status-right "#[bg=#7287fd,fg=#4c4f69,bold] %H:%M "

# Window status
set -g window-status-format "#[bg=#bcc0cc,fg=#4c4f69] #I:#W "
set -g window-status-current-format "#[bg=#df8e1d,fg=#dce0e8,bold] #I:#W "
set -g window-status-separator ""

# Messages
set -g message-style "bg=#d20f39,fg=#eff1f5"

# Pane borders
set -g pane-border-style "fg=#9ca0b0"
set -g pane-active-border-style "fg=#1e66f5"

# Clock
set -g clock-mode-colour "#1e66f5"
